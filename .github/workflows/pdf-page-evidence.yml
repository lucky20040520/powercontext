name: PDF page evidence acceptance

on:
  push:
    paths:
      - src/powercontext/sources/pdf_pages.py
      - tests/test_pdf_pages.py
      - tests/e2e/test_pdf_page_retrieval.py
      - competition/**
      - .github/workflows/pdf-page-evidence.yml
      - benchmark/pdf_retrieval/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the official fixed-dependency environment
        run: docker compose -f competition/compose.yaml build selftest

      - name: Verify PDF behavior offline with one CPU and two GiB
        env:
          POWERCONTEXT_CANDIDATE: ${{ github.workspace }}
        run: |
          docker compose -f competition/compose.yaml run --rm \
            -v "$PWD/tests/test_pdf_pages.py:/pdf-tests/test_pdf_pages.py:ro" \
            -v "$PWD/tests/e2e/test_pdf_page_retrieval.py:/pdf-tests/test_pdf_page_retrieval.py:ro" \
            selftest python -m pytest -q -s \
            -c /selftest/pytest.ini --confcutdir=/selftest \
            /selftest/challenges/source-03-pdf-retrieval/acceptance \
            /pdf-tests/test_pdf_pages.py \
            /pdf-tests/test_pdf_page_retrieval.py

      - name: Prepare original PDFs for the independent relevance audit
        run: >-
          python benchmark/pdf_retrieval/run.py
          --cases benchmark/pdf_retrieval/cases.json
          --pdf-dir .artifacts/pdf-relevance-inputs --download-only

      - name: Audit independent relevance and full-page coverage offline
        env:
          POWERCONTEXT_CANDIDATE: ${{ github.workspace }}
        run: |
          docker compose -f competition/compose.yaml run --rm \
            -v "$PWD/benchmark/pdf_retrieval/run.py:/pdf-relevance.py:ro" \
            -v "$PWD/benchmark/pdf_retrieval/cases.json:/pdf-relevance-cases.json:ro" \
            -v "$PWD/.artifacts/pdf-relevance-inputs:/pdf-input:ro" \
            selftest python /pdf-relevance.py \
            --cases /pdf-relevance-cases.json --pdf-dir /pdf-input --minimum-recall 0.95
